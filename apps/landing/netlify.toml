# Netlify configuration for the Implenix landing site (implenix.net).
#
# IMPORTANT — Netlify site settings:
#   * Set the site's "Base directory" to `apps/landing` so this file is picked up.
#   * Because this app lives in an npm-workspaces monorepo, dependencies must be
#     installed from the repository root. The build command below cds to the repo
#     root, installs all workspaces, and builds only this app.
#   * `publish` is relative to the base directory, so `dist` resolves to
#     `apps/landing/dist`.
#
# Required environment variable (Site settings → Environment variables):
#   PUBLIC_API_URL = https://api.implenix.net   (the Render API base URL)

[build]
  command = "cd ../.. && npm install && npm run build -w apps/landing"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Long-cache Astro's hashed assets.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Media (logo, photos) — cache a week, revalidate after.
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# Sensible security headers for a static marketing site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
